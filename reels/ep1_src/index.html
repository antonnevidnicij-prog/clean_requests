<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/oswald/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/oswald/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/400.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="data.js"></script>
<script>
const W = 1080, H = 1920, END = 89.5;
const C = {
  bg: '#121418', wall: '#1b1e23', wall2: '#16181c', panel: '#23272e', line: '#353a42',
  y: '#f2b632', r: '#e5372f', g: '#72c94b', w: '#f2f2f2', dim: '#4a4f57', gray: '#8a9099',
  navy: '#22335c', navy2: '#1a2747', skin: '#e3a57a', skin2: '#c98a62', cap: '#c9262b',
  zomb: '#7fbf4d', blue: '#4aa3e8', train: '#2f5d9c'
};
const main = document.getElementById('c').getContext('2d');
const off = document.createElement('canvas'); off.width = W; off.height = H;
const offc = off.getContext('2d');
let g = main;

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const eout = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const eback = t => { t = clamp(t); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function rect(x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function circ(x, y, r, col) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = col; g.fill(); }
function glow(x, y, r, col, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
}
function text(s, x, y, size, col, opt = {}) {
  g.save();
  g.font = `${opt.weight || 700} ${size}px ${opt.mono ? '"JetBrains Mono"' : 'Oswald'}`;
  g.letterSpacing = (opt.ls || 0) + 'px';
  g.textAlign = opt.align || 'center'; g.textBaseline = opt.base || 'middle';
  g.fillStyle = col;
  if (opt.glow) { g.shadowColor = col; g.shadowBlur = opt.glow; }
  g.fillText(s, x, y);
  g.restore();
}

// Plate: dark box with colored border and mono text, pops in at t0
function plate(s, x, y, col, t, t0, opt = {}) {
  const p = prog(t, t0, t0 + 0.28);
  if (p <= 0) return;
  let a = clamp(p * 2.5);
  if (opt.out !== undefined) a *= 1 - prog(t, opt.out, opt.out + 0.25);
  if (a <= 0) return;
  const fs = opt.fs || 42;
  g.save();
  g.font = `700 ${fs}px "JetBrains Mono"`; g.letterSpacing = '3px';
  const tw = g.measureText(s).width, pw = tw + fs * 1.1, ph = fs * 1.75;
  g.translate(x, y); g.rotate((opt.rot || 0) * Math.PI / 180);
  const sc = lerp(0.55, 1, eback(p)); g.scale(sc, sc);
  g.globalAlpha *= a;
  g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = 24;
  g.fillStyle = 'rgba(14,15,18,0.92)'; rr(-pw / 2, -ph / 2, pw, ph, 8); g.fill();
  g.shadowBlur = 0; g.lineWidth = 4; g.strokeStyle = col; g.stroke();
  g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(s, 0, fs * 0.06);
  g.restore();
}

// ---------- characters ----------
function woman(x, y, s, t, opt = {}) {
  g.save(); g.translate(x, y); g.scale(s, s);
  const br = Math.sin(t * 2.2) * 0.008;
  // shadow
  g.globalAlpha *= 1; g.fillStyle = 'rgba(0,0,0,.35)'; g.beginPath(); g.ellipse(0, 0, 70, 12, 0, 0, Math.PI * 2); g.fill();
  // legs / shoes
  rect(-30, -125, 24, 118, '#151c2e'); rect(6, -125, 24, 118, '#151c2e');
  g.fillStyle = '#0c0d10'; rr(-36, -14, 34, 14, 6); g.fill(); rr(2, -14, 34, 14, 6); g.fill();
  g.save(); g.translate(0, -125); g.scale(1, 1 + br); g.translate(0, 125);
  // skirt
  g.fillStyle = '#18233f'; g.beginPath(); g.moveTo(-50, -175); g.lineTo(50, -175); g.lineTo(58, -110); g.lineTo(-58, -110); g.closePath(); g.fill();
  // arms
  const arm = opt.armUp || 0;
  g.fillStyle = C.navy2; rr(-82, -262, 24, 120, 12); g.fill();
  g.save(); g.translate(70, -255); g.rotate(-arm * 1.9); g.fillStyle = C.navy2; rr(-12, 0, 24, 120, 12); g.fill(); circ(0, 126, 13, C.skin); g.restore();
  circ(-70, -136, 13, C.skin);
  // jacket
  g.fillStyle = C.navy; rr(-60, -268, 120, 108, 18); g.fill();
  rect(-60, -180, 120, 12, '#121a30');
  // lapels
  g.fillStyle = '#2c4175'; g.beginPath(); g.moveTo(-26, -268); g.lineTo(0, -225); g.lineTo(26, -268); g.closePath(); g.fill();
  g.fillStyle = '#f0f0f0'; g.beginPath(); g.moveTo(-12, -268); g.lineTo(0, -246); g.lineTo(12, -268); g.closePath(); g.fill();
  for (const yy of [-235, -210]) { circ(-12, yy, 4, C.y); circ(12, yy, 4, C.y); }
  // badge M
  g.fillStyle = C.cap; rr(-48, -255, 22, 20, 4); g.fill(); text('M', -37, -244, 15, '#fff');
  // epaulettes
  rect(-62, -268, 26, 7, C.y); rect(36, -268, 26, 7, C.y);
  g.restore();
  // neck + head
  rect(-11, -288, 22, 24, C.skin2);
  // hair back + bun
  circ(0, -318, 46, '#3a2418'); circ(-34, -296, 20, '#3a2418');
  circ(0, -315, 40, C.skin);
  // ears
  circ(-40, -312, 8, C.skin2); circ(40, -312, 8, C.skin2);
  // fringe
  g.fillStyle = '#3a2418'; g.beginPath(); g.ellipse(-6, -342, 38, 16, -0.2, 0, Math.PI * 2); g.fill();
  // face
  const blink = ((t + (opt.ph || 0)) % 3.7) < 0.12;
  if (blink) { rect(-20, -313, 12, 3, '#222'); rect(8, -313, 12, 3, '#222'); }
  else { circ(-14, -312, 4.5, '#1d1d1d'); circ(14, -312, 4.5, '#1d1d1d'); }
  rect(-22, -326, 14, 3, '#3a2418'); rect(8, -326, 14, 3, '#3a2418');
  g.fillStyle = 'rgba(220,110,100,.35)'; circ(-22, -298, 7, 'rgba(220,110,100,.3)'); circ(22, -298, 7, 'rgba(220,110,100,.3)');
  rect(-8, -292, 16, 3, opt.worried ? '#7a3b30' : '#8a4b3d');
  // cap (red duty cap)
  g.fillStyle = C.cap; g.beginPath(); g.ellipse(0, -356, 52, 17, 0, 0, Math.PI * 2); g.fill();
  rect(-38, -356, 76, 14, '#a81e22');
  g.fillStyle = '#111'; g.beginPath(); g.ellipse(4, -341, 44, 7, 0, 0, Math.PI); g.fill();
  circ(0, -352, 6, C.y);
  g.restore();
}

function person(x, y, s, seed, t, opt = {}) {
  const cols = ['#6b4f8a', '#3f6e8c', '#8c5a3f', '#5d7a3f', '#8a3f4f', '#4f5a8a', '#7a7a7a', '#a0763a'];
  const skins = ['#e3a57a', '#c98a62', '#f0c09a', '#a8704a'];
  const z = opt.zombie;
  const body = z ? '#5b5f55' : cols[Math.floor(rnd(seed) * cols.length)];
  const sk = z ? C.zomb : skins[Math.floor(rnd(seed + 3) * skins.length)];
  const run = opt.run ? Math.sin(t * 14 + seed * 7) : 0;
  g.save(); g.translate(x, y); g.scale(s * (opt.flip ? -1 : 1), s);
  // legs
  g.fillStyle = '#1f2228';
  g.save(); g.translate(-9, -70); g.rotate(run * 0.5); rr(-7, 0, 14, 70, 6); g.fill(); g.restore();
  g.save(); g.translate(9, -70); g.rotate(-run * 0.5); rr(-7, 0, 14, 70, 6); g.fill(); g.restore();
  // body
  g.fillStyle = body; rr(-24, -150, 48, 86, 16); g.fill();
  // arms
  g.fillStyle = z ? sk : body;
  if (z) { rr(0, -140, 64, 14, 7); g.fill(); rr(0, -118, 58, 14, 7); g.fill(); }
  else { g.save(); g.translate(-22, -142); g.rotate(0.3 + run * 0.6); rr(-6, 0, 12, 60, 6); g.fill(); g.restore();
         g.save(); g.translate(22, -142); g.rotate(-0.3 - run * 0.6); rr(-6, 0, 12, 60, 6); g.fill(); g.restore(); }
  // head
  circ(0, -176, 24, sk);
  if (!z) { g.fillStyle = ['#2a1c14', '#111', '#5a3a20', '#c9a060'][Math.floor(rnd(seed + 9) * 4)]; g.beginPath(); g.arc(0, -180, 25, Math.PI, 0); g.fill(); }
  if (z) { glow(-8, -178, 14, 'rgba(255,230,80,.9)'); glow(8, -178, 14, 'rgba(255,230,80,.9)'); circ(-8, -178, 4, '#ffe95a'); circ(8, -178, 4, '#ffe95a'); rect(-10, -164, 20, 4, '#2c3a22'); }
  else { circ(-8, -178, 3, '#1a1a1a'); circ(8, -178, 3, '#1a1a1a'); }
  g.restore();
}

function eyes(x, y, s, a, t, seed) {
  const bl = ((t + rnd(seed) * 5) % 4.2) < 0.15;
  if (bl || a <= 0) return;
  g.save(); g.globalAlpha *= a;
  glow(x - s, y, s * 2.2, 'rgba(255,215,60,.55)'); glow(x + s, y, s * 2.2, 'rgba(255,215,60,.55)');
  g.fillStyle = '#ffd84a';
  g.beginPath(); g.ellipse(x - s, y, s * 0.75, s * 0.42, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(x + s, y, s * 0.75, s * 0.42, 0, 0, Math.PI * 2); g.fill();
  g.restore();
}

// ---------- backgrounds ----------
function bgFill(col = C.bg) { rect(0, 0, W, H, col); }

function city(t) {
  const sky = g.createLinearGradient(0, 0, 0, 1100);
  sky.addColorStop(0, '#0b0d12'); sky.addColorStop(1, '#2a1214');
  g.fillStyle = sky; g.fillRect(0, 0, W, 1100);
  for (let i = 0; i < 60; i++) circ(rnd(i) * W, rnd(i + 50) * 600, rnd(i + 9) * 2 + 0.5, 'rgba(255,255,255,.5)');
  circ(820, 300, 50, '#e8e2c8'); glow(820, 300, 160, 'rgba(232,226,200,.25)');
  // buildings
  for (let i = 0; i < 9; i++) {
    const bx = i * 125 - 20, bw = 110, bh = 300 + rnd(i * 3) * 380, by = 1000 - bh;
    rect(bx, by, bw, bh + 100, i % 2 ? '#1e2128' : '#23262e');
    for (let wy = by + 24; wy < 980; wy += 44) for (let wx = bx + 14; wx < bx + bw - 14; wx += 26) {
      const id = i * 1000 + wy * 7 + wx;
      const offAt = 0.2 + rnd(id) * 1.6;
      if (rnd(id + 1) < 0.55 && t < offAt) rect(wx, wy, 14, 22, '#e8b84a');
      else rect(wx, wy, 14, 22, '#14161b');
    }
  }
  rect(0, 1000, W, 100, '#0d0e11');
  glow(300, 1010, 260, 'rgba(229,55,47,.35)'); glow(800, 1020, 220, 'rgba(229,90,47,.3)');
  for (let i = 0; i < 14; i++) eyes(40 + rnd(i + 70) * 1000, 1020 + rnd(i + 90) * 50, 7, clamp((t - rnd(i) * 1.2) * 3), t, i);
}

function stationWall(t, opt = {}) {
  const wg = g.createLinearGradient(0, 200, 0, 900);
  wg.addColorStop(0, '#20242b'); wg.addColorStop(1, '#171a1f');
  g.fillStyle = wg; g.fillRect(0, 0, W, 1100);
  // tile lines
  g.strokeStyle = 'rgba(255,255,255,.03)'; g.lineWidth = 2;
  for (let yy = 220; yy < 760; yy += 40) { g.beginPath(); g.moveTo(0, yy); g.lineTo(W, yy); g.stroke(); }
  // arches
  for (let i = -1; i < 5; i++) {
    const ax = i * 280 + 140 + (opt.pan || 0);
    g.fillStyle = '#0f1114'; g.beginPath(); g.moveTo(ax - 90, 760); g.lineTo(ax - 90, 430); g.arc(ax, 430, 90, Math.PI, 0); g.lineTo(ax + 90, 760); g.fill();
    rect(ax + 110, 300, 60, 460, '#2b3038'); rect(ax + 110, 300, 10, 460, '#363c46');
    glow(ax + 140, 280, 70, 'rgba(255,210,140,.35)'); circ(ax + 140, 282, 10, '#ffe2a8');
  }
  rect(0, 240, W, 40, '#262a31');
  // station sign
  if (!opt.nosign) { g.fillStyle = '#0d0f12'; rr(330, 312, 420, 70, 6); g.fill(); text('ГЛУБОКАЯ', 540, 348, 44, '#e8e8e8', { ls: 8 }); }
  // track pit
  rect(0, 760, W, 80, '#0b0c0e'); rect(0, 800, W, 6, '#3d4048'); rect(0, 822, W, 6, '#3d4048');
  // platform
  const pg = g.createLinearGradient(0, 840, 0, 1100);
  pg.addColorStop(0, '#30343c'); pg.addColorStop(1, '#1d2025');
  g.fillStyle = pg; g.fillRect(0, 840, W, 260);
  rect(0, 840, W, 10, '#d8d2b8'); rect(0, 850, W, 4, '#9a8a5a');
}

function trainCars(xoff) {
  for (let c = 0; c < 3; c++) {
    const x = xoff + c * 820;
    g.fillStyle = C.train; rr(x, 470, 800, 300, 26); g.fill();
    rect(x, 700, 800, 18, '#1f3f6c'); rect(x, 560, 800, 8, '#d8d8d8');
    for (let wi = 0; wi < 5; wi++) { g.fillStyle = '#f7e6b0'; rr(x + 40 + wi * 150, 500, 110, 56, 8); g.fill(); }
    rect(x + 360, 590, 80, 160, '#244a7d');
  }
  // tail lights at right end of last car
  const tx = xoff + 3 * 820 - 20;
  glow(tx - 10, 690, 70, 'rgba(255,40,30,.8)'); circ(tx - 10, 690, 12, '#ff3a2a');
}

function escalator(t, opt = {}) {
  bgFill('#101215');
  g.save();
  g.translate(540, 560); g.rotate(-0.5);
  rect(-900, -170, 1800, 340, '#1a1d22');
  rect(-900, -120, 1800, 240, '#22262c');
  // steps
  for (let i = -40; i < 40; i++) {
    const sx = ((i * 46 + (t * (opt.speed || 60)) % 46));
    rect(sx, -110, 4, 220, '#2d3239');
  }
  // balustrades with lamps
  rect(-900, -130, 1800, 14, '#3a3f47'); rect(-900, 116, 1800, 14, '#3a3f47');
  for (let i = -6; i < 7; i++) {
    const lx = i * 170;
    rect(lx - 5, -170, 10, 40, '#555b65'); glow(lx, -178, 50, 'rgba(255,214,150,.5)'); circ(lx, -178, 14, '#ffe0a6');
    rect(lx - 5, 130, 10, 40, '#555b65'); glow(lx, 178, 50, 'rgba(255,214,150,.5)'); circ(lx, 178, 14, '#ffe0a6');
  }
  if (opt.crowd) opt.crowd();
  g.restore();
}

// ---------- scenes ----------
const scenes = [];
function S(s, e, draw) { scenes.push({ s, e, draw }); }

// 1a: city + title
S(0, 1.5, (t, lt) => {
  city(t);
  const p = eback(prog(t, 0.05, 0.4));
  g.save(); g.globalAlpha = clamp(p);
  text('ГЕРМОЗАТВОР', 540, 300, 30, C.gray, { mono: true, ls: 10 });
  g.translate(540, 390); g.scale(lerp(1.4, 1, p), lerp(1.4, 1, p));
  text('ДЕНЬ 1', 0, 0, 150, C.r, { glow: 30 });
  g.restore();
});
// 1b/1c: dive through ground to station
S(1.5, 8.0, (t, lt) => {
  const cam = ease(prog(t, 1.6, 5.6)) * 1900;
  g.save(); g.translate(0, -cam);
  city(10);
  // surface
  rect(0, 1000, W, 40, '#2c2f36');
  // metro pavilion
  rect(380, 860, 320, 140, '#2a2e36'); rect(380, 850, 320, 16, '#3b404a');
  circ(540, 800, 44, C.cap); text('M', 540, 802, 56, '#fff');
  // soil layers
  const cols = ['#3a2c22', '#33271f', '#2c231d', '#262019', '#211c17', '#1b1714'];
  for (let i = 0; i < 6; i++) rect(0, 1040 + i * 330, W, 330, cols[i]);
  for (let i = 0; i < 80; i++) circ(rnd(i + 300) * W, 1060 + rnd(i + 400) * 1900, 4 + rnd(i + 500) * 10, 'rgba(0,0,0,.25)');
  // escalator shaft
  g.save(); g.strokeStyle = '#4a4f58'; g.lineWidth = 70; g.beginPath(); g.moveTo(540, 1000); g.lineTo(300, 2600); g.stroke();
  g.strokeStyle = '#1a1c20'; g.lineWidth = 50; g.stroke();
  for (let i = 0; i < 12; i++) { const k = i / 12; glow(lerp(540, 300, k), lerp(1000, 2600, k), 30, 'rgba(255,210,140,.5)'); }
  g.restore();
  // station hall
  g.fillStyle = '#15171b'; rr(120, 2560, 840, 340, 160); g.fill();
  g.fillStyle = '#23272e'; rr(150, 2590, 780, 280, 140); g.fill();
  for (let i = 0; i < 5; i++) { const lx = 250 + i * 145; glow(lx, 2650, 60, 'rgba(255,210,140,.5)'); circ(lx, 2650, 9, '#ffe2a8'); }
  rect(150, 2800, 780, 20, '#d8d2b8');
  g.restore();
  // depth ruler
  const ra = clamp(prog(t, 2.0, 2.6));
  g.save(); g.globalAlpha = ra;
  rect(60, 250, 6, 820, '#5b616b');
  const depth = clamp(cam / 1900) * 84;
  for (let m = 0; m <= 84; m += 12) { const yy = 250 + m / 84 * 820; rect(60, yy, 28, 4, '#8a9099'); text(m + ' м', 100, yy, 26, C.gray, { mono: true, align: 'left' }); }
  const my = 250 + depth / 84 * 820;
  g.fillStyle = C.y; g.beginPath(); g.moveTo(70, my); g.lineTo(96, my - 14); g.lineTo(96, my + 14); g.fill();
  g.restore();
  plate('84 М ПОД ЗЕМЛЁЙ', 600, 360, C.y, t, 5.85, { rot: -2 });
});
// 1d: hermetic door
S(8.0, 11.2, (t, lt) => {
  bgFill('#121418');
  const z = lerp(1, 1.06, prog(t, 8, 11.2));
  g.save(); g.translate(540, 600); g.scale(z, z); g.translate(-540, -600);
  rect(80, 180, 920, 880, '#2a2d33'); rect(80, 180, 920, 24, '#3a3e46');
  // slab
  const sg = g.createLinearGradient(160, 0, 920, 0);
  sg.addColorStop(0, '#5a606a'); sg.addColorStop(.5, '#6f7680'); sg.addColorStop(1, '#4e535c');
  g.fillStyle = sg; g.fillRect(160, 250, 760, 760);
  for (let i = 0; i < 8; i++) for (const yy of [280, 980]) circ(200 + i * 98, yy, 9, '#3d424a');
  // hazard stripes
  g.save(); rr(160, 900, 760, 60, 0); g.clip();
  for (let i = -2; i < 22; i++) { g.fillStyle = i % 2 ? '#111' : C.y; g.beginPath(); g.moveTo(160 + i * 50, 960); g.lineTo(210 + i * 50, 900); g.lineTo(260 + i * 50, 900); g.lineTo(210 + i * 50, 960); g.fill(); }
  g.restore();
  // wheel
  g.save(); g.translate(540, 600); g.rotate(t * 0.2);
  g.strokeStyle = '#2f333a'; g.lineWidth = 22; g.beginPath(); g.arc(0, 0, 120, 0, Math.PI * 2); g.stroke();
  for (let k = 0; k < 4; k++) { g.rotate(Math.PI / 4); rect(-130, -9, 260, 18, '#2f333a'); }
  circ(0, 0, 30, '#25282e');
  g.restore();
  g.restore();
  plate('ГЕРМОЗАТВОР 40 Т', 540, 320, C.y, t, 8.05, { rot: -2 });
  plate('СВОЙ ВОЗДУХ', 700, 850, C.g, t, 10.0, { rot: 2 });
});
// 1e: red tunnel with eyes
S(11.2, 14.8, (t, lt) => {
  bgFill('#1e0b0c');
  g.save(); g.translate(540, 600);
  for (let i = 8; i > 0; i--) { g.fillStyle = `rgb(${18 + i * 5},${8 + i * 2},${9 + i * 2})`; g.beginPath(); g.arc(0, 0, i * 70, 0, Math.PI * 2); g.fill(); }
  g.restore();
  g.strokeStyle = '#3a2020'; g.lineWidth = 8;
  g.beginPath(); g.moveTo(500, 620); g.lineTo(260, 1100); g.moveTo(580, 620); g.lineTo(820, 1100); g.stroke();
  for (let i = 0; i < 26; i++) eyes(rnd(i + 11) * W, 200 + rnd(i + 22) * 900, 6 + rnd(i) * 6, clamp((t - 11.3 - rnd(i + 5) * 2) * 2), t, i);
  eyes(540, 590, 22, clamp((t - 13.3) * 3), t + 0.3, 99);
  plate('ОДНА РОКОВАЯ ОШИБКА', 540, 870, C.r, t, 12.4, { rot: -3 });
});
// 2a: ID + platform
S(14.8, 18.7, (t, lt) => {
  stationWall(t);
  woman(330, 1010, 1.25, t);
  // ID card

function runners(t, phase, stopAt, gateBottom) {
  const N = 40;
  for (let i = 0; i < N; i++) {
    const t0 = 44.5 + i * 0.12 + rnd(i) * 0.1;
    const z = (t - t0) / 1.2; // 0..1 far->gate, >1 past
    if (z < 0 || z > 1.4) continue;
    if (t0 > stopAt) continue;
    const x = 540 + (rnd(i + 5) - .5) * lerp(160, 900, clamp(z));
    const y = lerp(600, 1080, clamp(z)) + (z > 1 ? (z - 1) * 600 : 0);
    const s = lerp(0.35, 1.5, clamp(z)) + (z > 1 ? (z - 1) * 2 : 0);
    if (phase === 'back' && z < 0.85) person(x, y, s, i, t, { run: true });
    if (phase === 'front' && z >= 0.85) person(x, y, s, i, t, { run: true });
  }
}

// ---------- captions ----------
const CHUNKS = `*rКонец *rсвета...|Станция метро|может оказаться|*gсамым *gбезопасным|местом в городе.|*yВосемьдесят *yчетыре метра|под землёй.|*yГермозатвор|*yсорок *yтонн.|Свой *gвоздух.|Но только если ты|не впустишь...|не *rтого *rчеловека.|Это *yНадежда *yОрлова.|*yСорок *yшесть лет.|*yДежурная по станции.|*yДвадцать лет она|провожала|один и тот же|последний поезд...|слушала|один и тот же|гул эскалаторов...|и закрывала|одни и те же|двери.|Но *yсегодня,|в *yноль *yчасов|*yдвенадцать *yминут,|последний поезд|*rопоздал.|А потом...|*rзавыла *rсирена.|Всем станциям.|*rЗакрыть гермозатворы.|*rНемедленно.|На мониторах|*yНадежда увидела|вестибюль.|Людей, которые|бежали вниз...|и тех, кто|бежал *rза *rними.|*yРычаг был|у неё в руке.|Ещё *yдесять человек.|Ещё *yпять.|Она дёрнула *yрычаг,|когда снаружи|оставалось|*rтридцать *rчеловек.|Они *rбили.|*rСкребли.|*rКричали.|Но *gсорок *gтонн стали|не *gсдвинулись.|А потом...|*dкрики *dстихли.|Тогда *yНадежда|составила *yплан.|На станции|*yдве *yтысячи *yтриста|человек.|На складе|гражданской обороны|еда на *yчетырнадцать *yдней.|Своя *gскважина.|*gДизель-генератор.|И *gфильтры, которые|чистят *gвоздух|с поверхности.|Она перекрыла|*yвыходы.|*yВентшахты.|Оба *yтоннеля.|Воздух?|*gЕсть.|Вода?|*gЕсть.|Свет?|*gЕсть.|*yНадежда продумала *yвсё.|*rКроме *rодного.|*rПоследний *rпоезд|так и не доехал|до станции.|А в *yтри *yчаса|*yсемь *yминут...|в тоннеле|*rзажглась *rфара.`;
const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9-]/g, '');
const COLS = { r: C.r, g: C.g, y: C.y, d: '#7a7f88' };
const caps = []; let wi = 0;
for (const ch of CHUNKS.split('|')) {
  const toks = ch.split(' ').map(tk => {
    let col = C.w, s = tk;
    if (tk[0] === '*') { col = COLS[tk[1]]; s = tk.slice(2); }
    const w = WORDS[wi++];
    if (!w || norm(w[0]) !== norm(s)) throw new Error('align fail at ' + s + ' vs ' + (w && w[0]));
    return { s: s.toUpperCase(), col, st: w[1], en: w[2] };
  });
  caps.push({ toks, st: toks[0].st - 0.06 });
}
if (wi !== WORDS.length) throw new Error('unused words ' + (WORDS.length - wi));
caps.forEach((c, i) => { const last = c.toks[c.toks.length - 1].en; c.en = i + 1 < caps.length ? Math.min(caps[i + 1].st, last + 1.4) : 86.4; });

function captions(t) {
  const c = caps.find(c => t >= c.st && t < c.en); if (!c) return;
  const p = eback(prog(t, c.st, c.st + 0.14));
  let size = 104;
  g.save(); g.font = `700 ${size}px Oswald`;
  const full = () => c.toks.map(k => k.s).join(' ');
  while (g.measureText(full()).width > 900 && size > 60) { size -= 4; g.font = `700 ${size}px Oswald`; }
  const sp = g.measureText(' ').width;
  const widths = c.toks.map(k => g.measureText(k.s).width);
  const total = widths.reduce((a, b) => a + b, 0) + sp * (c.toks.length - 1);
  g.translate(540, 1385); g.scale(lerp(0.9, 1, p), lerp(0.9, 1, p));
  g.globalAlpha = clamp(p * 3);
  let x = -total / 2;
  g.textBaseline = 'middle'; g.textAlign = 'left';
  c.toks.forEach((k, i) => {
    const said = t >= k.st - 0.03;
    g.shadowColor = 'rgba(0,0,0,.8)'; g.shadowBlur = 18;
    g.fillStyle = said ? k.col : C.dim;
    g.fillText(k.s, x, 0);
    x += widths[i] + sp;
  });
  g.restore();
}

function hud(t) {

}

// ---------- frame ----------
const SHIFT = 190;
function drawScene(sc, t) { g.save(); g.translate(0, SHIFT); sc.draw(t, t - sc.s); g.restore(); }
function render(t) {
  g = main;
  main.setTransform(1, 0, 0, 1, 0, 0); main.globalAlpha = 1;
  rect(0, 0, W, H, C.bg);
  const idx = scenes.findIndex(s => t >= s.s && t < s.e);
  const i = idx < 0 ? scenes.length - 1 : idx;
  const sc = scenes[i], lt = t - sc.s, FADE = 0.22;
  if (lt < FADE && i > 0) {
    drawScene(scenes[i - 1], t);
    g = offc; offc.setTransform(1, 0, 0, 1, 0, 0); offc.globalAlpha = 1; offc.clearRect(0, 0, W, H);
    drawScene(sc, t);
    g = main; main.globalAlpha = lt / FADE; main.drawImage(off, 0, 0); main.globalAlpha = 1;
  } else drawScene(sc, t);
  // bottom fade into caption area (skip on end card)
  const fg = g.createLinearGradient(0, 1190, 0, 1320);
  fg.addColorStop(0, 'rgba(18,20,24,0)'); fg.addColorStop(1, 'rgba(18,20,24,1)');
  if (t < 86.4) { g.fillStyle = fg; g.fillRect(0, 1190, W, 130); rect(0, 1320, W, H - 1320, C.bg); }
  // top shade for HUD legibility
  const tg = g.createLinearGradient(0, SHIFT, 0, SHIFT + 140); tg.addColorStop(0, 'rgba(18,20,24,1)'); tg.addColorStop(1, 'rgba(18,20,24,0)');
  if (t < 86.4) { rect(0, 0, W, SHIFT, C.bg); g.fillStyle = tg; g.fillRect(0, SHIFT, W, 140); }
  // vignette
  const vg = g.createRadialGradient(540, 700, 300, 540, 700, 1100); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  hud(t);
  captions(t);
}
