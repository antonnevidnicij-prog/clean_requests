<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/russo-one/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">

</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="vo_timeline.js" onerror="0"></script>
<script>
const W = 1080, H = 1920;
const C = {
  bg: '#08131c', deep: '#0b1a20', panel: '#10232a', panel2: '#173039', line: '#24444f',
  t: '#8fdcff', cy: '#d6f3ff', r: '#ff3b3b', a: '#ff8a2a', w: '#eaf6f7', mute: '#6f8f97',
  sleeve: '#1b2a4a', cuff: '#c9262b', skin: '#e0a47c', skin2: '#c4875f', zomb: '#86c35a'
};
const main = document.getElementById('c').getContext('2d');
const mk = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; };
const [buf, bctx] = mk(), [buf2, b2ctx] = mk();
let g = main;

// ---------- utils ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const ease = k => { k = clamp(k); return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const eout = k => { k = clamp(k); return 1 - Math.pow(1 - k, 3); };
const eback = k => { k = clamp(k); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const fmt = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function rect(x, y, w, h, col) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function circ(x, y, r, col) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = col; g.fill(); }
function glow(x, y, r, col, a = 1) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.globalAlpha *= a; g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
}
function text(s, x, y, size, col, o = {}) {
  g.save();
  const fam = o.mono ? '"JetBrains Mono"' : o.ui ? '"Russo One"' : 'Inter';
  g.font = `${o.weight || (o.ui ? 400 : o.mono ? 700 : 900)} ${size}px ${fam}`;
  g.letterSpacing = (o.ls || 0) + 'px';
  g.textAlign = o.align || 'center'; g.textBaseline = o.base || 'middle';
  if (o.glow) { g.shadowColor = col; g.shadowBlur = o.glow; }
  g.fillStyle = col; g.fillText(s, x, y);
  g.restore();
}
function wrap(s, maxW) {
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const tryS = cur ? cur + ' ' + w : w; if (g.measureText(tryS.replace(/[*_]/g, '')).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tryS; }
  if (cur) lines.push(cur); return lines;
}

// ---------- timeline (no voice: timing by reading speed) ----------
const BEATS = [
  ['SNOW', 'Минус *68.*'],
  ['SNOW', 'До ближайшего человека — *1 300* километров.'],
  ['HAND', 'А бур только что поднял из льда… _руку._'],
  ['BASE', 'Ты — начальник зимовки на станции *«Купол».*'],
  ['BASE', '*Четырнадцать* человек.'],
  ['BASE', 'Последний самолёт улетел _вчера._'],
  ['BASE', 'Следующий — через *8* *месяцев.*'],
  ['SHAFT', 'Глубина — *3 200* метров.'],
  ['SHAFT', 'Керн идёт наверх.'],
  ['CORE', 'Внутри льда — _человеческая_ _ладонь._'],
  ['CORE', 'Пальцы _сжаты._'],
  ['RADAR', 'Георадар показывает: он там _не_ _один._'],
  ['RADAR', 'Их десятки. _Сотни._'],
  ['RADAR', 'Они стоят во льду. *Вертикально.*'],
  ['RADAR', 'Как будто _ждут._'],
  ['D1', 'Сообщишь на Большую землю — или *промолчишь?*'],
  ['D1', null, 3.0],
  ['D1', '*Ты* *выходишь* *на* *связь.*', 1.6],
  ['RADIO', '#БОЛЬШАЯ ЗЕМЛЯ: Бурение прекратить. Керн уничтожить. Это приказ.'],
  ['RADIO', 'И связь _пропадает._ _Навсегда._'],
  ['LAB', 'Биолог Вера уже положила керн в лабораторию.'],
  ['LAB', 'Лёд _тает._'],
  ['D2', 'Уничтожишь его — или дашь *изучить* *одну* *ночь?*'],
  ['D2', null, 3.0],
  ['D2', '*Ты* *даёшь* *ей* *одну* *ночь.*', 1.6],
  ['NIGHT', '03:40 ночи.'],
  ['NIGHT', 'Генератор _глохнет._'],
  ['NIGHT', 'Минус 68 заходят _внутрь._'],
  ['NIGHT', 'В лаборатории — лужа воды.'],
  ['NIGHT', 'И _пустой_ _лоток._'],
  ['TRACKS', 'Мокрые следы ведут к *жилому* *блоку.*'],
  ['TRACKS', 'Там спят *12* человек.'],
  ['D3', 'Поднимешь всех — или пойдёшь *один?*'],
  ['D3', null, 4.5],
];
const T = []; let acc = 0.3;
BEATS.forEach(b => { T.push(acc); const s = b[1]; acc += b[2] || Math.max(1.7, s.replace(/[*_#]/g, '').length / 15 + 0.5); });
if (window.VO_T) { T.length = 0; T.push(...window.VO_T); acc = window.VO_END; }
const END = acc;
const sceneStart = {}; BEATS.forEach((b, i) => { if (!(b[0] in sceneStart)) sceneStart[b[0]] = T[i]; });
const ORDER = Object.keys(sceneStart);
const sceneEnd = k => { const i = ORDER.indexOf(k); return i + 1 < ORDER.length ? sceneStart[ORDER[i + 1]] : END; };

// ---------- POV hands ----------
function hand(x, y, ang, s, opt = {}) {
  g.save(); g.translate(x, y); g.rotate(ang); g.scale(s, s);
  g.fillStyle = C.sleeve; rr(-70, 40, 140, 600, 50); g.fill();
  g.fillStyle = C.cuff; rr(-72, 30, 144, 34, 12); g.fill();
  g.fillStyle = C.skin; rr(-62, -80, 124, 125, 46); g.fill();
  for (let k = 0; k < 4; k++) { g.fillStyle = k % 2 ? C.skin : '#d6996f'; rr(-58 + k * 30, -124 + (opt.grip ? 30 : Math.abs(k - 1.5) * 8), 26, 70, 13); g.fill(); }
  g.fillStyle = C.skin2; rr(46, -40, 34, 70, 16); g.fill();
  g.restore();
}

// ---------- scenes ----------
function stationThroughGlass(t, tint = 'rgba(47,212,200,.06)') {
  const sg = g.createLinearGradient(0, 200, 0, 980); sg.addColorStop(0, '#0d2027'); sg.addColorStop(1, '#09161b');
  g.fillStyle = sg; g.fillRect(0, 0, W, 1000);
  for (let i = -1; i < 5; i++) {
    const ax = i * 300 + 150;
    g.fillStyle = '#061014'; g.beginPath(); g.moveTo(ax - 95, 900); g.lineTo(ax - 95, 520); g.arc(ax, 520, 95, Math.PI, 0); g.lineTo(ax + 95, 900); g.fill();
    glow(ax + 150, 420, 90, 'rgba(142,238,255,.18)');
  }
  rect(0, 880, W, 120, '#0e1e24');
  g.fillStyle = tint; g.fillRect(0, 0, W, 1000);
  // glass reflections
  g.save(); g.globalAlpha = 0.07; g.fillStyle = '#fff';
  g.beginPath(); g.moveTo(120, 200); g.lineTo(260, 200); g.lineTo(60, 980); g.lineTo(-80, 980); g.fill();
  g.beginPath(); g.moveTo(640, 200); g.lineTo(690, 200); g.lineTo(490, 980); g.lineTo(440, 980); g.fill();
  g.restore();
  rect(0, 190, W, 22, '#14272e'); rect(0, 980, W, 24, '#14272e');
}
function desk(t, opt = {}) {
  g.fillStyle = '#0f2026'; g.beginPath(); g.moveTo(40, 1000); g.lineTo(1040, 1000); g.lineTo(1300, 1920); g.lineTo(-220, 1920); g.fill();
  g.fillStyle = '#1c3740'; g.beginPath(); g.moveTo(40, 1000); g.lineTo(1040, 1000); g.lineTo(1060, 1030); g.lineTo(20, 1030); g.fill();
  // buttons
  for (let r = 0; r < 3; r++) for (let i = 0; i < 9; i++) {
    const k = r / 3, x = lerp(110, 90, k) + i * lerp(96, 102, k), y = 1070 + r * 70;
    if (i > 5 && r < 2) continue;
    g.fillStyle = '#18303a'; rr(x, y, 70, 44, 8); g.fill();
    const col = [C.t, C.a, C.t, C.r, C.t, C.a][(i + r * 2) % 6];
    const on = rnd(i * 7 + r + Math.floor(t * (opt.alarm ? 6 : 1.5))) > 0.35;
    circ(x + 35, y + 22, 8, on ? col : '#244049'); if (on) glow(x + 35, y + 22, 26, col, 0.5);
  }
  // small screen
  g.fillStyle = '#05100f'; rr(130, 1300, 420, 160, 10); g.fill(); g.strokeStyle = C.line; g.lineWidth = 4; g.stroke();
  text('ГЕРМОКОНТУР', 160, 1340, 24, C.mute, { mono: true, align: 'left' });
  const st = opt.state || 'ОТКРЫТ';
  text('● ' + st, 160, 1400, 40, st === 'ОТКРЫТ' ? C.t : C.r, { mono: true, align: 'left', glow: 10 });
  // lever
  const la = opt.lever || 0;
  g.fillStyle = '#1a2e35'; rr(780, 1180, 200, 120, 14); g.fill();
  rect(866, 1120, 28, 80, '#0a1418');
  g.save(); g.translate(880, 1200); g.rotate(-0.25 + la * 0.9);
  rect(-12, -260, 24, 260, '#9fb3b9'); circ(0, -270, 46, C.r); circ(-12, -282, 12, '#ff8a80');
  g.restore();
  // hands
  hand(330, 1560, 0.25, 1.15);
  if (opt.handOnLever) {
    g.save(); g.translate(880, 1200); g.rotate(-0.25 + la * 0.9); hand(0, -230, -0.35, 1.05, { grip: true }); g.restore();
  } else hand(790, 1580, -0.3, 1.15);
}
function alarmWash(t, a = 1) {
  const p = (Math.sin(t * 7) + 1) / 2;
  g.save(); g.globalAlpha = (0.08 + 0.2 * p) * a; rect(0, 0, W, H, C.r); g.restore();
}

function board(t, status) {
  rect(0, 0, W, H, '#08151a');
  g.save(); g.translate(540, 650); g.transform(1, -0.04, 0, 1, 0, 0);
  g.fillStyle = '#020506'; rr(-460, -230, 920, 460, 18); g.fill(); g.strokeStyle = '#21404a'; g.lineWidth = 8; g.stroke();
  for (let y = -210; y < 220; y += 9) rect(-440, y, 880, 1, 'rgba(255,255,255,.03)');
  text('ПОСЛЕДНИЙ ПОЕЗД', -410, -140, 56, C.a, { mono: true, align: 'left', glow: 18 });
  text('ПРИБЫТИЕ', -410, -40, 50, C.a, { mono: true, align: 'left', glow: 18 });
  text('00:12', 410, -40, 70, C.a, { mono: true, align: 'right', glow: 18 });
  if (Math.floor(t * 2.4) % 2) text(status, -410, 110, 64, C.r, { mono: true, align: 'left', glow: 22 });
  g.restore();
}
function phone(t) {
  board(t, 'ЗАДЕРЖКА');
  g.save(); g.globalAlpha = 0.55; rect(0, 0, W, H, '#03090b'); g.restore();
  // receiver in hand (left)
  g.save(); g.translate(400, 1150); g.rotate(-0.5);
  g.fillStyle = '#1d1f22'; rr(-60, -330, 120, 660, 50); g.fill();
  g.fillStyle = '#2a2d31'; rr(-110, -380, 220, 140, 60); g.fill(); rr(-110, 240, 220, 140, 60); g.fill();
  g.restore();
  hand(430, 1350, -0.2, 1.1, { grip: true });
  for (let k = 0; k < 3; k++) {
    const on = Math.floor(t * 1.6) % 2 === 0;
    g.save(); g.globalAlpha = on ? 1 : 0.25; text('—', 700 + k * 90, 700, 90, C.cy); g.restore();
  }
  text('ЛИНИЯ 2 · «ЗАРЕЧНАЯ»', 790, 820, 26, C.mute, { mono: true });
  text('НЕТ ОТВЕТА', 790, 870, 40, C.r, { mono: true });
}
function speaker(t, i0) {
  rect(0, 0, W, H, '#071216');
  const talk = t > T[i0 + 1];
  g.save(); g.translate(540, 640);
  circ(0, 0, 300, '#0f2329'); circ(0, 0, 270, '#13303a');
  for (let r = 30; r < 250; r += 34) for (let a = 0; a < Math.PI * 2; a += 0.42 * 60 / r * 0.9) circ(Math.cos(a) * r, Math.sin(a) * r, 7, '#061014');
  // radial waveform
  for (let k = 0; k < 64; k++) {
    const a = k / 64 * Math.PI * 2;
    const amp = talk ? 10 + 70 * Math.abs(Math.sin(t * 13 + k * 1.7) * Math.sin(t * 5.3 + k * 0.6)) : 6 + 6 * rnd(k + Math.floor(t * 20));
    g.strokeStyle = talk ? C.cy : C.line; g.lineWidth = 8; g.lineCap = 'round';
    g.beginPath(); g.moveTo(Math.cos(a) * 320, Math.sin(a) * 320); g.lineTo(Math.cos(a) * (320 + amp), Math.sin(a) * (320 + amp)); g.stroke();
  }
  g.restore();
  text('КАНАЛ 1 · ДИСПЕТЧЕРСКАЯ', 540, 1060, 28, C.mute, { mono: true, ls: 2 });
  if (talk && Math.floor(t * 2) % 2) circ(345, 1060, 10, C.r);
  alarmWash(t, talk ? 0.6 : 0.2);
}

function decision(t, n, sub, A, B, i0, timerBeat, pick) {
  rect(0, 0, W, H, '#061014');
  if (DEC_BG[n]) blurBg(() => DEC_BG[n](t));
  g.strokeStyle = 'rgba(47,212,200,.06)'; g.lineWidth = 2;
  for (let x = 0; x < W; x += 60) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y < H; y += 60) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  glow(540, 700, 700, 'rgba(47,212,200,.10)');
  const p0 = eback(prog(t, T[i0], T[i0] + 0.4));
  g.save(); g.globalAlpha = clamp(p0 * 2);
  text('РЕШЕНИЕ ' + n, 540, 410, 96, C.w, { ui: true, ls: 4 });
  text(sub, 540, 490, 28, C.t, { mono: true, ls: 3 });
  g.restore();
  // timer ring
  const tr = timerBeat != null ? T[timerBeat] : null;
  const ringY = 680;
  if (tr != null) {
    const rem = 5 * (1 - prog(t, tr - 2, tr + 3));
    const col = rem < 2 ? C.r : C.t;
    g.lineWidth = 16; g.strokeStyle = '#173039'; g.beginPath(); g.arc(540, ringY, 100, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = col; g.beginPath(); g.arc(540, ringY, 100, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * rem / 5); g.stroke();
    text(Math.ceil(rem).toString(), 540, ringY + 4, 96, col, { ui: true, glow: 16 });
  } else {
    const pl = (Math.sin(t * 4) + 1) / 2;
    text('?', 540, ringY + 4, 170, C.a, { ui: true, glow: 20 + pl * 30 });
  }
  // cards
  const sel = pick != null && t > T[pick];
  [[A, 'А', 0], [B, 'Б', 1]].forEach(([label, L, k]) => {
    const pc = eback(prog(t, T[i0] + 0.25 + k * 0.15, T[i0] + 0.65 + k * 0.15));
    if (pc <= 0) return;
    const y = 900 + k * 200;
    const chosen = sel && k === 1, dim = sel && k === 0;
    const pulse = pick == null ? (Math.sin(t * 5 + k * 3) + 1) / 2 : 0;
    g.save(); g.translate(lerp(k ? 1400 : -400, 540, pc), y);
    const sc = chosen ? 1 + 0.04 * eback(prog(t, T[pick], T[pick] + 0.3)) : 1; g.scale(sc, sc);
    g.globalAlpha = dim ? 0.35 : 1;
    g.shadowColor = chosen ? C.t : 'rgba(0,0,0,.5)'; g.shadowBlur = chosen ? 40 : 20 + pulse * 20;
    g.fillStyle = chosen ? '#0f3a3a' : '#0d1f25'; rr(-440, -80, 880, 160, 26); g.fill();
    g.shadowBlur = 0; g.lineWidth = 5; g.strokeStyle = chosen ? C.t : pick == null ? (k ? C.a : C.cy) : '#2a4b55'; g.stroke();
    circ(-360, 0, 50, chosen ? C.t : '#173039'); text(L, -360, 4, 56, chosen ? '#04100f' : C.w, { ui: true });
    text(label, -280, 4, 50, C.w, { ui: true, align: 'left' });
    g.restore();
  });
  if (sel) {
    const ps = eback(prog(t, T[pick] + 0.15, T[pick] + 0.45));
    g.save(); g.translate(760, 1250); g.rotate(-0.12); g.scale(lerp(2, 1, ps), lerp(2, 1, ps)); g.globalAlpha = clamp(ps * 2);
    g.strokeStyle = C.r; g.lineWidth = 7; rr(-200, -50, 400, 100, 12); g.stroke();
    text('ВЫБОР СДЕЛАН', 0, 4, 48, C.r, { ui: true });
    g.restore();
  }
}

function cam(x, y, w, h, label, t, inner, alert) {
  g.fillStyle = '#0a1518'; rr(x - 10, y - 10, w + 20, h + 20, 12); g.fill();
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip(); g.translate(x, y);
  rect(0, 0, w, h, '#0e1b1f'); inner(w, h);
  for (let yy = 0; yy < h; yy += 5) rect(0, yy, w, 2, 'rgba(0,0,0,.22)');
  g.fillStyle = 'rgba(120,230,220,.07)'; g.fillRect(0, 0, w, h);
  g.restore();
  g.lineWidth = alert ? 6 : 3; g.strokeStyle = alert && Math.floor(t * 4) % 2 ? C.r : alert ? '#7a1d1d' : '#1f3a43'; g.strokeRect(x, y, w, h);
  text(label, x + 16, y + 26, 20, alert ? C.r : C.cy, { mono: true, align: 'left' });
  if (alert) text('АНОМАЛИЯ', x + w - 16, y + 26, 20, C.r, { mono: true, align: 'right' });
}
function figure(x, y, s, seed, t, z) {
  const run = Math.sin(t * 14 + seed * 5);
  g.save(); g.translate(x, y); g.scale(s, s);
  const col = z ? '#4c5a52' : ['#5c7f8c', '#8c6f5c', '#6f5c8c', '#5c8c6a', '#8c5c6a'][Math.floor(rnd(seed) * 5)];
  g.fillStyle = '#0c1416';
  g.save(); g.translate(-7, -50); g.rotate(run * 0.5); rr(-6, 0, 12, 50, 5); g.fill(); g.restore();
  g.save(); g.translate(7, -50); g.rotate(-run * 0.5); rr(-6, 0, 12, 50, 5); g.fill(); g.restore();
  g.fillStyle = col; rr(-18, -110, 36, 64, 12); g.fill();
  if (z) { g.fillStyle = C.zomb; rr(0, -104, 46, 11, 5); g.fill(); rr(0, -88, 42, 11, 5); g.fill(); }
  circ(0, -128, 18, z ? C.zomb : '#d9a07a');
  if (z) { glow(-6, -130, 10, 'rgba(255,230,90,.9)'); glow(6, -130, 10, 'rgba(255,230,90,.9)'); }
  g.restore();
}
function camWall(t, i0) {
  rect(0, 0, W, H, '#050c0e');
  const zOn = t > T[i0 + 2] + 0.6;
  const cw = 470, ch = 330;
  cam(50, 380, cw, ch, 'КАМ 1 · ЭСКАЛАТОР', t, (w, h) => {
    g.save(); g.translate(w / 2, h / 2); g.rotate(0.5);
    rect(-500, -70, 1000, 140, '#1a2c31'); rect(-500, -76, 1000, 8, '#2c4850'); rect(-500, 68, 1000, 8, '#2c4850');
    for (let i = 0; i < 14; i++) figure(((t * 160 + rnd(i) * 1000) % 1000) - 500, 50 - rnd(i + 3) * 60, 0.5, i, t);
    if (zOn) for (let i = 0; i < 5; i++) figure(-520 + (t - T[i0 + 2] - 0.6) * 180 - rnd(i + 9) * 150, 50 - rnd(i + 4) * 60, 0.52, i + 50, t, true);
    g.restore();
  });
  cam(560, 380, cw, ch, 'КАМ 2 · ТУРНИКЕТЫ', t, (w, h) => {
    rect(0, 220, w, 110, '#16262a');
    for (let i = 0; i < 5; i++) { rect(30 + i * 90, 170, 50, 70, '#2c4248'); }
    for (let i = 0; i < 9; i++) figure(((t * 190 + rnd(i + 20) * 700) % 700) - 100, 280 + rnd(i) * 30, 0.6, i + 20, t);
    if (zOn) for (let i = 0; i < 6; i++) figure(-60 + (t - T[i0 + 2] - 0.6) * 120 + rnd(i + 30) * 120, 290 + rnd(i + 1) * 25, 0.62, i + 70, t, true);
  }, zOn);
  cam(50, 760, cw, ch, 'КАМ 3 · ПЛАТФОРМА', t, (w, h) => {
    rect(0, 220, w, 110, '#16262a'); rect(0, 210, w, 8, '#c9c3a6');
    const n = Math.floor(lerp(4, 46, prog(t, T[i0], T[i0 + 3] + 1)));
    for (let i = 0; i < n; i++) figure(10 + rnd(i + 200) * (w - 20), 250 + rnd(i + 300) * 70, 0.45 + rnd(i) * 0.15, i + 200, 0);
  });
  cam(560, 760, cw, ch, 'КАМ 4 · ВХОД «ГЛУБОКАЯ»', t, (w, h) => {

      text('ОТ ЭТОГО ЗАВИСИТ ЧАСТЬ 2', 540, 1525, 28, C.mute, { mono: true, ls: 2 });
      g.restore(); } }
};

// ---------- HUD ----------
function hud(t) {
  if (t > T[33]) return;
  const n = t >= T[32] ? 3 : t >= T[22] ? 2 : t >= T[15] ? 1 : 0;
  text('КУПОЛ · ЧАСТЬ 1', 60, 150, 22, C.mute, { mono: true, align: 'left', ls: 2 });
  for (let k = 0; k < 3; k++) { g.fillStyle = k < n ? C.t : '#1a3346'; rr(60 + k * 58, 175, 46, 14, 7); g.fill(); }
  const inside = t > T[26];
  const temp = inside ? Math.round(lerp(18, -41, ease(prog(t, T[26], T[29])))) : -68;
  text(inside ? 'ВНУТРИ' : 'СНАРУЖИ', 1020, 150, 22, C.mute, { mono: true, align: 'right', ls: 2 });
  text((temp > 0 ? '+' : '−') + Math.abs(temp) + ' °C', 1020, 205, 64, inside ? (temp < 0 ? C.t : C.a) : C.t, { ui: true, align: 'right', glow: inside ? 12 : 0 });
  let info = '';
  if (t > T[4]) info += 'ЛЮДЕЙ: ' + Math.min(14, Math.floor(lerp(0, 14, prog(t, T[4], T[4] + 1.1))));
  if (t > T[6]) info += '   САМОЛЁТ: 243 ДН.';
  if (info) text(info, 60, 222, 24, C.a, { mono: true, align: 'left' });
}

// ---------- subtitles ----------
function subtitle(t) {
  let i = -1; for (let k = 0; k < BEATS.length; k++) if (t >= T[k]) i = k;
  if (i < 0 || !BEATS[i][1]) return;
  let s = BEATS[i][1];
  const radio = s[0] === '#' || s[0] === '%'; const rc = s[0] === '%' ? C.r : C.cy; if (radio) s = s.slice(1);
  const fs = radio ? 46 : 60;
  g.save();
  g.font = `${radio ? 700 : 900} ${fs}px ${radio ? '"JetBrains Mono"' : 'Inter'}`;
  const lines = wrap(s, 880);
  const lh = fs * 1.22, bh = lines.length * lh + 44;
  const by = 1470 - bh;
  const pb = eout(prog(t, T[i], T[i] + 0.18));
  g.globalAlpha = pb; g.fillStyle = radio ? 'rgba(4,14,16,.9)' : 'rgba(3,9,11,.8)';
  rr(70, by, 940, bh, 22); g.fill();
  if (radio) { g.strokeStyle = rc; g.lineWidth = 3; g.stroke(); }
  g.textBaseline = 'middle'; g.textAlign = 'center';
  let wi = 0;
  const dur = (T[i + 1] || END) - T[i];
  const nWords = s.split(' ').length, step = Math.min(0.16, dur * 0.55 / nWords);
  lines.forEach((ln, li) => {
    const parts = ln.split(' '), clean = parts.map(w => w.replace(/[*_]/g, ''));
    const sp = g.measureText(' ').width;
    const tot = clean.reduce((a, w) => a + g.measureText(w).width, 0) + sp * (parts.length - 1);
    let x = 540 - tot / 2; const y = by + 22 + lh * (li + 0.5);
    parts.forEach((w, k) => {
      const ww = g.measureText(clean[k]).width, tw = T[i] + 0.05 + (wi++) * step;
      const p = prog(t, tw, tw + 0.2);
      if (p > 0) {
        let col = radio ? rc : C.w; const hot = w.includes('*') || w.includes('_');
        if (w.includes('*')) col = C.t; if (w.includes('_')) col = C.r;
        g.save(); g.translate(x + ww / 2, y + lerp(26, 0, eout(p))); const sc = hot ? lerp(1.6, 1, eback(p)) : lerp(0.6, 1, eback(p)); g.scale(sc, sc);
        g.globalAlpha = clamp(p * 3);
        if (hot) { g.shadowColor = col; g.shadowBlur = 18; }
        g.fillStyle = col; g.fillText(clean[k], 0, 0); g.restore();
      }
      x += ww + sp;
    });
  });
  g.restore();
}

const runStart = []; BEATS.forEach((b, i) => runStart.push(i > 0 && BEATS[i - 1][0] === b[0] ? runStart[i - 1] : i));
const IMP = [[T[2] + 2.6, 34], [T[5], 10], [T[10] + 0.4, 18], [T[15] + 0.3, 14], [T[15] + 0.45, 14], [T[17], 26], [T[19], 22],
  [T[22] + 0.3, 14], [T[22] + 0.45, 14], [T[24], 26], [T[26] + 0.2, 30], [T[29] + 0.3, 24], [T[32] + 0.3, 14], [T[32] + 0.45, 14]];
const ALARM = new Set([]);
function render(t) {
  let i = 0; for (let k = 0; k < BEATS.length; k++) if (t >= T[k]) i = k;
  const key = BEATS[i][0], rs = runStart[i];
  let re = BEATS.length; for (let k = i + 1; k < BEATS.length; k++) if (runStart[k] !== rs) { re = k; break; }
  const shotS = T[rs], shotE = T[re] || END;
  // draw scene to buffer
  g = bctx; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none';
  rect(0, 0, W, H, C.bg);
  g.save(); SCN[key](t, i); g.restore();
  if (ALARM.has(key)) beacon(t, key === 'A' ? 0.35 : 0.2);
  // camera
  g = main; g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
  rect(0, 0, W, H, '#000');
  const ct = t - shotS;
  let z = 1.02 + 0.07 * ease(prog(t, shotS, shotE)) + 0.04 * Math.exp(-(t - T[i]) * 7);
  if (ct < 0.32 && rs > 0) z *= lerp(1.22, 1, eout(ct / 0.32));
  let amp = ALARM.has(key) ? 5 : 2.5;
  if (key === 'TRACKS') amp += 4;
  if (key === 'SNOW' || key === 'NIGHT') amp += 3;
  if (key === 'RUN' || key === 'ZRUSH') amp += 6;
  for (const [h, s] of IMP) if (t > h) amp += s * Math.exp(-(t - h) * 8);
  const sx = amp * (Math.sin(t * 13.1) + Math.sin(t * 29.7 + 1.3)) / 2, sy = amp * (Math.sin(t * 11.3 + 2) + Math.sin(t * 23.9)) / 2;
  const rot = amp * 0.0006 * Math.sin(t * 5.1);
  g.save(); g.translate(540 + sx, 860 + sy); g.rotate(rot); g.scale(z, z); g.translate(-540, -860);
  if (ct < 0.3 && rs > 0) {
    const k = 1 - ct / 0.3;
    for (let y = 0; y < H; y += 120) { const dx = (rnd(y + Math.floor(t * 60)) - .5) * 160 * k; g.drawImage(buf, 0, y, W, 120, dx, y, W, 120); }
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.35 * k;
    g.drawImage(buf, 18 * k, 0); g.drawImage(buf, -18 * k, 0);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  } else g.drawImage(buf, 0, 0);
  g.restore();
  if (ct < 0.12 && rs > 0) { g.save(); g.globalAlpha = (1 - ct / 0.12) * 0.55; rect(0, 0, W, H, '#dffcff'); g.restore(); }
  // tunnel whiteout before decision 3
  if (key === 'I' && t > shotE - 0.5) { g.save(); g.globalAlpha = prog(t, shotE - 0.5, shotE); rect(0, 0, W, H, '#f4fdff'); g.restore(); }
  const vg = g.createRadialGradient(540, 860, 300, 540, 860, 1200); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.6)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
  const tg = g.createLinearGradient(0, 0, 0, 340); tg.addColorStop(0, 'rgba(3,8,10,.9)'); tg.addColorStop(1, 'rgba(3,8,10,0)');
  g.fillStyle = tg; g.fillRect(0, 0, W, 340);
  hud(t);
  subtitle(t);
  if (t < 0.3) { g.save(); g.globalAlpha = 1 - t / 0.3; rect(0, 0, W, H, '#000'); g.restore(); }
}
window.render = render; window.END = END; window.T = T; window.BEATS = BEATS;
window.ready = Promise.all(['400 40px "Russo One"', '900 40px Inter', '800 40px Inter', '700 40px "JetBrains Mono"'].map(f => document.fonts.load(f, 'АБВ123'))).then(() => document.fonts.ready);
</script></body></html>
